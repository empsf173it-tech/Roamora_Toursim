<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>R</text></svg>">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your Roamora account to manage bookings, view itineraries, and access exclusive member deals.">
  <title>Login | Roamora Travel &amp; Tourism</title>
  <link rel="canonical" href="login.html">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--tertiary); padding: 80px 20px 40px; }
    .auth-card-wrap {
      width: 100%;
      max-width: 480px;
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 48px 44px 40px;
      position: relative;
      margin: auto;
    }
    [data-theme="dark"] .auth-card-wrap { background: var(--secondary-lt); }
    .auth-card-theme-btn {
      position: absolute;
      top: -55px;
      right: 0;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--tertiary);
      color: var(--text-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      cursor: pointer;
      transition: var(--transition-fast);
    }
    .auth-card-theme-btn:hover { background: var(--primary); color: var(--secondary); border-color: var(--primary); }
    [data-theme="dark"] .auth-card-theme-btn { background: rgba(255,255,255,0.08); }
  </style>
</head>
<body>

<div class="cursor-dot"></div><div class="cursor-ring"></div>

<div class="auth-card-wrap">
  <!-- Theme Toggle — top right of card -->
  <button class="auth-card-theme-btn theme-toggle" aria-label="Toggle theme">
    <i class="bi bi-moon-stars-fill"></i>
  </button>

<!-- Logo -->
  <a href="index.html" class="auth-logo-link" style="margin-bottom: 28px; justify-content: center;">
    <div class="nav-logo-icon"><i class="bi bi-compass-fill"></i></div>
    Roam<span style="color:var(--primary);">ora</span>
  </a>

  <h1 class="auth-form-title" style="text-align:center;">Welcome Back!</h1>
  <p class="auth-form-sub" style="text-align:center;">Sign in to your Roamora account to continue your journey.</p>

<!-- Login Form -->
  <form data-validate id="loginForm" aria-label="Login form" novalidate>
    <div class="form-group-custom">
      <label class="form-label-custom" for="loginEmail">Email Address</label>
      <input class="form-input-custom" type="email" id="loginEmail" placeholder="you@email.com" required autocomplete="email" aria-required="true">
    </div>
    <div class="form-group-custom">
      <label class="form-label-custom" for="loginPassword">Password</label>
      <div class="input-with-icon">
        <input class="form-input-custom" type="password" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password" aria-required="true" style="padding-right:44px;">
        <i class="input-icon bi bi-eye" data-toggle-pass aria-label="Show/hide password"></i>
      </div>
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:12px;">
      <div class="form-check-custom">
        <input type="checkbox" id="rememberMe">
        <label for="rememberMe">Remember me for 30 days</label>
      </div>
      <a href="#" style="color:var(--primary); font-size:0.82rem; font-weight:500; white-space:nowrap;">Forgot password?</a>
    </div>
    <button type="submit" class="btn-primary-custom w-100 justify-content-center" style="padding:15px; font-size:1rem;">
      <span>Sign In to Roamora</span><i class="bi bi-arrow-right"></i>
    </button>
  </form>

  <!-- Social Login -->
  <div class="or-divider" style="margin-top:24px;"><span>or continue with</span></div>
  <div class="social-login">
    <button class="social-btn" type="button" id="googleLoginBtn" aria-label="Continue with Google">
      <i class="bi bi-google google-icon"></i>
      <span>Google</span>
    </button>
    <button class="social-btn" type="button" id="facebookLoginBtn" aria-label="Continue with Facebook">
      <i class="bi bi-facebook facebook-icon"></i>
      <span>Facebook</span>
    </button>
  </div>


  



  



   


   


  <p class="auth-switch">Don't have an account? <a href="signup.html">Create one free →</a></p>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
