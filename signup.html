<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>R</text></svg>">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your free Roamora account and start planning extraordinary travel experiences with access to exclusive deals and personalized itineraries.">
  <title>Sign Up | Roamora Travel &amp; Tourism</title>
  <link rel="canonical" href="signup.html">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--tertiary); padding: 24px 0; }
    .auth-card-wrap {
      width: 100%;
      max-width: 520px;
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 48px 44px 40px;
      position: relative;
      margin: 40px auto;
    }
    [data-theme="dark"] .auth-card-wrap { background: var(--secondary-lt); }
    .auth-card-theme-btn {
      position: fixed;
      top: 30px;
      right: 30px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--tertiary);
      color: var(--text-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      cursor: pointer;
      transition: var(--transition-fast);
    }
    .auth-card-theme-btn:hover { background: var(--primary); color: var(--secondary); border-color: var(--primary); }
    [data-theme="dark"] .auth-card-theme-btn { background: rgba(255,255,255,0.08); }
  </style>
</head>
<body>

<div class="cursor-dot"></div><div class="cursor-ring"></div>

  <!-- Theme Toggle — top right of card -->
  <button class="auth-card-theme-btn theme-toggle" aria-label="Toggle theme">
    <i class="bi bi-moon-stars-fill"></i>
  </button>

<div class="auth-card-wrap">

<!-- Logo -->
  <a href="index.html" class="auth-logo-link" style="margin-bottom: 28px; justify-content: center;">
    <div class="nav-logo-icon"><i class="bi bi-compass-fill"></i></div>
    Roam<span style="color:var(--primary);">ora</span>
  </a>

  <h1 class="auth-form-title" style="text-align:center;">Create Account</h1>
  <p class="auth-form-sub" style="text-align:center;">Join Roamora free — your next adventure is one click away.</p>

  <!-- Signup Form -->
  <form data-validate id="signupForm" aria-label="Sign up form" novalidate>
    <div class="row g-3">
      <div class="col-sm-6">
        <div class="form-group-custom">
          <label class="form-label-custom" for="signupFirstName">First Name</label>
          <input class="form-input-custom" type="text" id="signupFirstName" placeholder="John" required autocomplete="given-name">
        </div>
      </div>
      <div class="col-sm-6">
        <div class="form-group-custom">
          <label class="form-label-custom" for="signupLastName">Last Name</label>
          <input class="form-input-custom" type="text" id="signupLastName" placeholder="Smith" required autocomplete="family-name">
        </div>
      </div>
    </div>

    <div class="form-group-custom">
      <label class="form-label-custom" for="signupEmail">Email Address</label>
      <input class="form-input-custom" type="email" id="signupEmail" placeholder="john@email.com" required autocomplete="email">
    </div>

    <div class="form-group-custom">
      <label class="form-label-custom" for="signupPhone">Phone Number</label>
      <input class="form-input-custom" type="tel" id="signupPhone" placeholder="+1 (555) 000-0000" autocomplete="tel">
    </div>

    <div class="form-group-custom">
      <label class="form-label-custom" for="signupPassword">Password</label>
      <div class="input-with-icon">
        <input class="form-input-custom" type="password" id="signupPassword" placeholder="Min. 8 characters" required autocomplete="new-password" style="padding-right:44px;">
        <i class="input-icon bi bi-eye" data-toggle-pass aria-label="Show/hide password"></i>
      </div>
    </div>

    <div class="form-group-custom">
      <label class="form-label-custom" for="signupConfirmPassword">Confirm Password</label>
      <div class="input-with-icon">
        <input class="form-input-custom" type="password" id="signupConfirmPassword" placeholder="Repeat your password" required autocomplete="new-password" style="padding-right:44px;">
        <i class="input-icon bi bi-eye" data-toggle-pass aria-label="Show/hide password"></i>
      </div>
    </div>

    <!-- Travel Preference -->
    <div class="form-group-custom">
      <label class="form-label-custom" for="signupTravelStyle">Travel Style</label>
      <select class="form-input-custom" id="signupTravelStyle" style="cursor:pointer;">
        <option value="">What kind of traveler are you?</option>
        <option>Adventure Seeker</option>
        <option>Luxury Traveler</option>
        <option>Cultural Explorer</option>
        <option>Beach &amp; Relaxation</option>
        <option>Budget Backpacker</option>
        <option>Family Vacationer</option>
        <option>Business Traveler</option>
      </select>
    </div>

    <div style="margin-bottom:20px;">
      <div class="form-check-custom">
        <input type="checkbox" id="termsAccept" required>
        <label for="termsAccept">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
      </div>
    </div>
    <div style="margin-bottom:28px;">
      <div class="form-check-custom">
        <input type="checkbox" id="newsletterSignup" checked>
        <label for="newsletterSignup">Send me exclusive deals and travel inspiration</label>
      </div>
    </div>

    <button type="submit" class="btn-primary-custom w-100 justify-content-center" style="padding:15px; font-size:1rem;">
      <span>Create My Account</span><i class="bi bi-arrow-right"></i>
    </button>
  </form>

  <!-- Social Login — below the submit button -->
  <div class="or-divider" style="margin-top:24px;"><span>or continue with</span></div>
  <div class="social-login">
    <button class="social-btn" type="button" id="googleSignupBtn" aria-label="Sign up with Google">
      <i class="bi bi-google google-icon"></i>
      <span>Google</span>
    </button>
    <button class="social-btn" type="button" id="facebookSignupBtn" aria-label="Sign up with Facebook">
      <i class="bi bi-facebook facebook-icon"></i>
      <span>Facebook</span>
    </button>
  </div>

  <p class="auth-switch">Already have an account? <a href="login.html">Sign in ?</a></p>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
